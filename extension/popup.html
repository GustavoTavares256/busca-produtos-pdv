<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Prévia por Código de Barras</title>
  <style>
    body { width: 280px; margin: 0; padding: 14px; font: 13px/1.4 "Segoe UI", Arial, sans-serif; color: #1f2430; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
    #status { margin: 10px 0 0; padding: 8px; border-radius: 6px; background: #f1f3f6; }
    #status.on { background: #e7f4e8; color: #1b5e20; }
    #status.off { background: #fdecea; color: #8e1c1c; }
    p.ajuda { color: #555; font-size: 12px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <h1>Prévia por Código de Barras</h1>
  <label><input type="checkbox" id="ativo"> Ativada</label>
  <div id="status">Carregando…</div>
  <p class="ajuda">
    No PDV, digite ou leia um código de barras: o nome, o código, o preço e o estoque
    do produto aparecem embaixo do campo. Confirme com Enter normalmente.
  </p>
  <script src="popup.js"></script>
</body>
</html>
